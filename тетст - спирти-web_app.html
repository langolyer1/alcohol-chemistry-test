<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Тест: Спирти (Контроль знань)</title>
    <style>
        body { 
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f0f2f5; display: flex; justify-content: center; padding: 20px; margin: 0; 
        }
        #quiz-container { 
            background: white; width: 100%; max-width: 750px; padding: 30px; 
            border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); min-height: 400px; 
        }
        .question-card { display: none; }
        .question-card.active { display: block; }
        h2 { color: #2c3e50; font-size: 1.3rem; margin-top: 0; }
        .timer { font-weight: bold; color: #e74c3c; float: right; font-size: 1.2rem; background: #fee; padding: 5px 15px; border-radius: 20px; }
        .options-list { list-style: none; padding: 0; margin-top: 20px; }
        .options-list li { margin-bottom: 10px; background: #f8f9fa; padding: 15px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .options-list li:hover { background: #eef2f7; border-color: #3498db; }
        .btn { background: #3498db; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-size: 1rem; width: 100%; margin-top: 15px; font-weight: bold; }
        .btn:hover { background: #2980b9; }
        #result-screen, #name-screen { text-align: center; padding: 20px; }
        .progress-bar { width: 100%; height: 10px; background: #eee; border-radius: 5px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: #3498db; width: 0%; transition: 0.4s; }
        input[type="text"] { padding: 12px; width: 90%; margin-bottom: 20px; border-radius: 8px; border: 2px solid #ddd; font-size: 1rem; }
        .matching-row { display: flex; align-items: center; margin-bottom: 12px; background: #f8f9fa; padding: 10px 15px; border-radius: 8px; border: 1px solid #eee; font-size: 0.95rem; }
        .matching-row select { margin-left: auto; padding: 8px; border-radius: 5px; border: 1px solid #3498db; background: #fff; }
        .checkbox-option { display: block; margin: 10px 0; padding: 12px; background: #f8f9fa; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="quiz-container">
    <div id="name-screen">
        <h2 style="font-size: 1.8rem;">Хімія: Спирти (Модуль)</h2>
        <p>Введіть своє прізвище та ім'я для початку тестування. На кожне питання дається 60 секунд.</p>
        <input type="text" id="student-name" placeholder="Прізвище та Ім'я" required autocomplete="off">
        <button class="btn" onclick="startQuiz()">ПЕРЕЙТИ ДО ТЕСТУ</button>
    </div>

    <div id="quiz-content" style="display: none;">
        <div id="timer-display" class="timer">60</div>
        <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
        <div id="questions-wrapper"></div>
    </div>

    <div id="result-screen" style="display: none;">
        <h2 id="final-status">Обробка відповідей...</h2>
        <p id="score-text" style="font-size: 1.5rem; font-weight: bold; color: #2c3e50;"></p>
        <p id="db-status">Зачекайте, дані обробляються.</p>
    </div>
</div>

<script>
// ВСТАВТЕ ВАШУ СКОПІЙОВАНУ URL-АДРЕСУ З GOOGLE APPS SCRIPT
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwDu5mSShcKgiQHUqarL9GPz-URTABXo6aD4-I9qRyNUVzaTn2lUXrQzAyIArW8yikT/exec";

// Назва тесту для Google Таблиці
const QUIZ_TITLE = "Тест: Спирти";

// Питання без ключів правильних відповідей у коді
const qD = [
    {t:'single', q:'1. Загальна формула гомологічного ряду насичених одноатомних спиртів:', o:['CₙH₂ₙ₊₁OH','CₙH₂ₙ₋₂O','CₙH₂ₙO','CₙH₂ₙ₊₂O₂']},
    {t:'single', q:'2. Назви насичених одноатомних спиртів за систематичною номенклатурою мають суфікс:', o:['-аль','-ол','-діол','-ен']},
    {t:'single', q:'3. Спирти мають вищі температури кипіння порівняно з відповідними вуглеводнями внаслідок:', o:['Збільшення молекулярної маси','Наявності атома Оксигену','Появи рухливого атома Гідрогену','Утворення міжмолекулярних водневих зв\'язків']},
    {t:'single', q:'4. Скільки ізомерних спиртів відповідають молекулярній формулі C₄H₁₀O?', o:['2','3','4','5']},
    {t:'single', q:'5. Гомологічна різниця спиртів — це:', o:['—CH₃','—CH₂—','—C₂H₄—','—OH']},
    {t:'match', q:'6. Розташуйте сполуки в порядку збільшення рухливості атома Гідрогену:', l:['1 (Найменша)','2','3 (Найбільша)'], r:['C₃H₇OH','CH₃CH₂OH','C₆H₅CH₂OH']},
    {t:'match', q:'7. Розташуйте спирти у порядку збільшення їх кислотних властивостей:', l:['1 (Слабші)','2','3','4','5 (Сильніші)'], r:['2-Метилпропан-1-ол','Пропан-1-ол','Етанол','2-Хлоретанол','2,2-Дихлоретанол']},
    {t:'single', q:'8. Первинний одноатомний спирт — це спирт, у якому:', o:['Наявна одна гідроксильна група','Ланцюг атомів Карбону нерозгалужений','Гідроксильна група сполучена з первинним атомом Карбону','Атом Оксигену зв\'язаний із першим атомом']},
    {t:'single', q:'9. Який із наведених спиртів НЕ є первинним?', o:['Метиловий','Етиловий','Пропіловий','Ізопропіловий']},
    {t:'single', q:'10. Який із наведених спиртів є третинним?', o:['3-Гексанол','2-Гексанол','2-Метил-3-пентанол','3-Метил-3-пентанол']},
    {t:'single', q:'11. Яку речовину використовують як каталізатор у реакції гідратації етиленових вуглеводнів?', o:['Концентровану сульфатну кислоту (H₂SO₄)','Металевий натрій (Na)','Натрій гідроксид (NaOH)','Купрум(II) оксид (CuO)']},
    {t:'single', q:'12. Укажіть загальну суму коефіцієнтів у рівнянні повного згоряння 1-бутанолу:', o:['12','14','16','18']},
    {t:'single', q:'13. Металевий натрій прореагував із 2-пропанолом. До суміші додали брометан. Скільки атомів H в етері?', o:['6','10','12','14']},
    {t:'single', q:'14. До етанолу додали натрій, а потім на отриману сполуку поділи етилхлоридом:', o:['Спирт','Простий етер (ефір)','Складний етер','Ненасичений вуглеводень']},
    {t:'multi', q:'15. Які з наведених спиртів знебарвлюють бромну воду?', o:['2-Пентанол','3-Пентанол','1-Пентен-3-ол','2-Пентен-4-ол']},
    {t:'single', q:'16. При дегідратації ізомерних пропілових спиртів утворюється:', o:['Одинакової будови (пропен)','Різної геометричної будови','Суміш бутенів','Етилен']},
    {t:'multi', q:'17. Визначте спирти, з 1 моль яких при взаємодії з натрієм виділяється 1 моль H₂:', o:['2-Метил-2-пропанол','1,2-Пропандіол','1,3-Бутандіол','1,2,3-Пропантріол']},
    {t:'single', q:'18. Який реагент потрібен на 3-й стадії перетворень: Етан → Хлоретан → Етилен →(3)→ Етанол?', o:['Хлор (Cl₂)','Натрій гідроксид (водний)','Концентровану H₂SO₄','Вода в присутності кислоти (H₂O, H⁺)']},
    {t:'single', q:'19. Скільки стереоізомерних алкенів утворюється при дегідратації 3-пентанолу?', o:['1','2 (цис- та транс-)','3','4']},
    {t:'single', q:'20. Визначте молярну масу (г/моль) проміжної речовини А: 1-пропанол → А → 2-хлорпропан', o:['42','56','28','70']},
    {t:'single', q:'21. Який спирт утворюється в результаті реакції: 2-метил-1-пропанол → 2-метилпропен →(+H₂O)→ А?', o:['Первинний','Вторинний','Третинний','Двохатомний']},
    {t:'single', q:'22. Суміш 1-бутену та 2-бутену обробили водою в присутності каталізатора. Скільки спиртів утворилося?', o:['1','2','3','4']},
    {t:'single', q:'23. Скільки ізомерних бутилових спиртів може утворитися внаслідок гідратації усіх бутенів?', o:['1','2','3','4']},
    {t:'single', q:'24. Скільки ізомерних первинних спиртів з нерозгалуженим ланцюгом відповідають формулі C₅H₁₁OH?', o:['1','2','3','4']},
    {t:'single', q:'25. Скільки третинних спиртів існує серед ізомерних спиртів складу C₅H₁₁OH?', o:['1','2','3','4']},
    {t:'single', q:'26. Яка з наведених назв відповідає правилам номенклатури IUPAC?', o:['3,3-Диметил-2-етил-2-бутанол','2,2-Диметил-3-етилбутанол-3','2,2,3-Триметил-3-пентанол','2-трет-Бутилбутанол-2']},
    {t:'single', q:'27. Виберіть систематичну назву для спирту CH₃-CH₂-C(CH₃)(OH)-CH₂-CH₂-CH₃:', o:['2-Пропіл-2-бутанол','2-Етил-2-пентанол','3-Метил-3-гексанол','4-Метил-4-гексанол']},
    {t:'single', q:'28. Які з наведених сполук НЕ можуть безпосередньо утворювати спирти в одну стадію?', o:['Бутан','Етилен','Пропен','Хлоретан']},
    {t:'single', q:'29. Визначте кількість моль спирту, який виділяє 67,2 л H₂ при взаємодії з калієм:', o:['2 моль','3 моль','4 моль','6 моль']},
    {t:'single', q:'30. Скільки простих етерів може утворитися при нагріванні суміші метанолу та пропанолу-1?', o:['1','2','3','4']}
];

let cQ = 0, tL = 60, tI = null, uN = "";
let userAnswers = {};

function startQuiz() {
    uN = document.getElementById('student-name').value.trim();
    if (!uN) { 
        alert('Будь ласка, введіть своє прізвище та ім\'я!'); 
        return; 
    }
    document.getElementById('name-screen').style.display = 'none';
    document.getElementById('quiz-content').style.display = 'block';
    render(); 
    show();
}

function render() {
    const w = document.getElementById('questions-wrapper');
    w.innerHTML = '';
    qD.forEach((d, i) => {
        const dv = document.createElement('div');
        dv.className = `question-card q-${i}`;
        dv.innerHTML = `<h2>Питання ${i+1}/${qD.length}</h2><p style="font-weight:bold; font-size: 1.1rem;">${d.q}</p>`;
        
        if(d.t === 'single') {
            const u = document.createElement('ul'); u.className='options-list';
            d.o.forEach((o, k) => { 
                const l = document.createElement('li'); l.innerText = o;
                l.onclick = () => { userAnswers[i] = k; nxt(); }; 
                u.appendChild(l);
            }); 
            dv.appendChild(u);
        } else if(d.t === 'multi') {
            const m = document.createElement('div'); m.style.textAlign='left';
            d.o.forEach((o, k) => { 
                m.innerHTML += `<label class="checkbox-option"><input type="checkbox" class="c-${i}" value="${k}"> ${o}</label>`; 
            });
            const b = document.createElement('button'); b.className='btn'; b.innerText='Відповісти';
            b.onclick = () => {
                const ch = Array.from(document.querySelectorAll(`.c-${i}:checked`)).map(v => parseInt(v.value));
                userAnswers[i] = ch; 
                nxt();
            }; 
            dv.appendChild(m); dv.appendChild(b);
        } else if(d.t === 'match') {
            const box = document.createElement('div');
            d.l.forEach((it, k) => {
                let op = d.r.map((r, ri) => `<option value="${ri}">${r}</option>`).join('');
                box.innerHTML += `<div class="matching-row"><span>${it}</span><select class="s-${i}">${op}</select></div>`;
            });
            const b = document.createElement('button'); b.className='btn'; b.innerText='Далі';
            b.onclick = () => {
                const sel = Array.from(document.querySelectorAll(`.s-${i}`)).map(s => parseInt(s.value));
                userAnswers[i] = sel; 
                nxt();
            }; 
            dv.appendChild(box); dv.appendChild(b);
        }
        w.appendChild(dv);
    });
}

function show() {
    if(cQ >= qD.length) return fin();
    const cds = document.querySelectorAll('.question-card');
    cds.forEach(c => c.classList.remove('active')); 
    if(cds[cQ]) cds[cQ].classList.add('active');
    
    document.getElementById('progress').style.width = `${(cQ / qD.length) * 100}%`;
    tL = 60; 
    document.getElementById('timer-display').innerText = tL;
    clearInterval(tI);
    tI = setInterval(() => { 
        tL--; 
        document.getElementById('timer-display').innerText = tL; 
        if(tL <= 0) nxt(); 
    }, 1000);
}

function nxt() { cQ++; show(); }

function fin() {
    clearInterval(tI);
    document.getElementById('quiz-content').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';

    fetch(SCRIPT_URL, { 
        method: "POST", 
        body: JSON.stringify({ 
            name: uN, 
            quizName: QUIZ_TITLE,
            answers: userAnswers 
        }) 
    })
    .then(res => res.json())
    .then(data => { 
        if(data.status === "success") {
            document.getElementById('final-status').innerText = "Тестування завершено!"; 
            document.getElementById('score-text').innerText = `${uN}: ${data.resultText}`;
            document.getElementById('db-status').innerText = "Ваш результат успішно збережено."; 
        } else {
            document.getElementById('final-status').innerText = "Завершено"; 
            document.getElementById('db-status').innerText = "Помилка обробки результату."; 
        }
    })
    .catch(() => { 
        document.getElementById('final-status').innerText = "Тестування завершено!";
        document.getElementById('db-status').innerText = "Результат відправлено на сервер."; 
    });
}
</script>
</body>
</html>
